<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div class="brand-t"><div class="text-heading-sm">Интеллект X</div><div class="cap subtle" id="brand-sub"></div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot cap subtle" id="side-foot"></div>
  </aside>
  <div class="side-scrim" id="side-scrim" hidden></div>

  <div class="main-wrap">
    <header class="top" data-chrome>
      <button class="btn btn-icon menu-btn" id="menu-btn">{{ic:three-bars}}</button>
      <div class="top-t">
        <h1 class="text-heading-md" id="page-title"></h1>
        <div class="cap muted" id="org-name"></div>
      </div>
      <div class="sp"></div>
      <button class="mode-chip" id="mode-chip" data-kit-menu="#mode-menu"></button>
      <label class="lang hide-sm" id="lang-wrap">{{ic:globe}}<select class="field field-compact" id="lang"><option value="ru">Русский</option><option value="en">English</option></select></label>
      <button class="btn btn-icon" id="proto-btn" data-kit-menu="#proto-pop">{{ic:sliders}}</button>
      <button class="btn btn-icon" id="theme-btn" data-kit-theme>{{ic:moon}}</button>
      <button class="user-btn" id="user-btn" data-kit-menu="#user-menu"><span class="user-meta"><b id="user-name"></b><span id="user-role"></span></span>{{ic:chevron-down}}</button>
      <time class="clock hide-sm mono" id="clock"></time>
    </header>
    <div class="msgbar msgbar-band" data-sev="warning" id="stale" hidden role="status"></div>
    <main id="view" tabindex="-1"></main>
    <footer class="statusbar" id="statusbar" data-chrome></footer>
  </div>
</div>

<div class="menu" id="mode-menu" hidden role="menu"></div>
<div class="popover" id="proto-pop" hidden data-kit-keep-open></div>
<div class="menu" id="user-menu" hidden role="menu"></div>

<div class="sheet-scrim" id="sheet-scrim" hidden></div>
<aside class="sheet" id="sheet" tabindex="-1"></aside>
<dialog class="dialog" id="dlg"></dialog>
<div class="toast-host"><div class="toasts" id="toasts" aria-live="polite"></div></div>
